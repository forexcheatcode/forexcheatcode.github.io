    <style>
      :root{--brand-green:#2ca65a;--brand-dark:#087443;--brand-light:#effff5;--text-color:#333333;--muted-color:#6c757d;--white:#ffffff}*{box-sizing:border-box}body,html{width:100%;min-height:100%;margin:0}body{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 35%,rgba(44,166,90,.08),transparent 40%),#fff;color:var(--text-color);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none}.thankyou-header{width:100%;min-height:54px;display:flex;align-items:center;border-bottom:1px solid var(--brand-green)}.header-container{width:100%;max-width:1200px;margin:0 auto;padding:0 25px;display:flex;align-items:center;justify-content:space-between}.logo{display:inline-flex;align-items:center;line-height:0}.home-link,.thankyou-icon{align-items:center;color:var(--brand-green)}.thankyou-logo{display:block;width:auto;height:32px;max-width:190px;object-fit:contain}.home-link{display:inline-flex;gap:6px;padding:7px 13px;background:#fff;border:1px solid var(--brand-green);border-radius:50px;font-size:12px;font-weight:600;transition:.3s}.home-link:hover{background:var(--brand-green);color:#fff}.thankyou-main{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:70px 20px 80px}.thankyou-content{width:100%;max-width:800px;text-align:center}.thankyou-icon{width:76px;height:76px;margin:0 auto 20px;display:flex;justify-content:center;border-radius:50%;background:rgba(44,166,90,.1);font-size:32px;animation:3s ease-in-out infinite floatingIcon}.subscription-status,.thankyou-actions{display:flex;align-items:center}@keyframes floatingIcon{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.thankyou-title{margin:0 0 14px;color:var(--brand-dark);font-size:clamp(30px, 5vw, 46px);font-weight:700;line-height:1.15}.thankyou-description{max-width:570px;margin:0 auto 28px;color:var(--muted-color);font-size:15px;line-height:1.8}.subscription-status{max-width:570px;margin:0 auto 30px;padding:12px 16px;justify-content:center;gap:8px;border:1px solid rgba(44,166,90,.18);border-radius:8px;background:var(--brand-light);color:var(--brand-dark);font-size:12px;font-weight:600}.subscription-status i{font-size:15px}.thankyou-actions{justify-content:center;flex-wrap:wrap;gap:12px}.thankyou-btn{min-width:145px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:7px;font-size:13px;font-weight:700;transition:.3s}.primary-btn{background:var(--brand-green);color:#fff;box-shadow:0 6px 18px rgba(44,166,90,.22)}.primary-btn:hover{background:var(--brand-dark);color:#fff;transform:translateY(-2px);box-shadow:0 9px 22px rgba(44,166,90,.28)}.secondary-btn{border:1px solid var(--brand-green);background:#fff;color:var(--brand-green)}.secondary-btn:hover{background:var(--brand-green);color:#fff;transform:translateY(-2px)}.thankyou-footer{padding:18px 20px;border-top:1px solid rgba(44,166,90,.12);background:var(--brand-light);text-align:center}.thankyou-footer p{margin:0;color:var(--muted-color);font-size:11px}.thankyou-footer strong{color:var(--brand-green)}@media (max-width:575px){.header-container{padding:0 15px}.thankyou-logo{height:28px;max-width:165px}.home-link{padding:6px 10px;font-size:11px}.thankyou-main{padding:55px 18px 60px}.thankyou-icon{width:65px;height:65px;font-size:27px}.thankyou-title{font-size:clamp(28px, 8vw, 38px)}.thankyou-description{font-size:14px;line-height:1.7}.subscription-status{font-size:11px}.thankyou-actions{flex-direction:column}.thankyou-btn{width:100%;max-width:260px}}@media (prefers-reduced-motion:reduce){.thankyou-icon{animation:none}.home-link,.thankyou-btn{transition:none}}
    </style>

  <body>
    <!--==============================================================
    # Header
    ==============================================================-->
    <header class="thankyou-header">
      <div class="header-container">
        <!-- Existing Website Logo -->
        <a href="https://forexcheatcode.github.io/" class="logo" aria-label="Forex Cheat Code Home">

    <!--==============================================================

    ==============================================================-->
    <footer class="thankyou-footer">

        <strong>Forex Cheat Code</strong>. All rights reserved.

      document.getElementById("current-year").textContent = new Date().getFullYear();
